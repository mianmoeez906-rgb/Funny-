<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- FIRST SCREEN -->
    <section id="firstScreen" class="screen">

        <div class="envelope">💌</div>

        <h1>Hey You 👀</h1>

        <p>Something is waiting for you...</p>

        <button id="openBtn">
            OPEN THIS ❤️
        </button>

    </section>


    <!-- SECOND SCREEN -->
    <section id="secondScreen" class="screen hidden">

        <!-- Background stars -->
        <div class="star star1">✦</div>
        <div class="star star2">✧</div>
        <div class="star star3">✦</div>
        <div class="star star4">✧</div>
        <div class="star star5">✦</div>

        <!-- Hand -->
        <div class="hand-container">
            <div class="hand">👆</div>
        </div>

        <!-- Main content -->
        <div class="content">

            <p class="small-text">HEY...</p>

            <h1 id="personName">MOMINA</h1>

            <p class="message">
                This little surprise is specially for you 😂❤️
            </p>

            <div class="ghop-text">
                GHOP GHOP 😂
            </div>

        </div>

        <!-- MUSIC -->
        <audio id="music" loop preload="auto">
            <source src="ghop-ghop.mp3" type="audio/mpeg">
        </audio>

    </section>


    <script src="script.js"></script>

</body>
</html>
